name: Update FPL data and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install squad planner
        run: pip install -r requirements.txt
      - name: Fetch public FPL data
        run: python3 scripts/fetch_fpl.py
      - name: Check forecasts and squads
        run: |
          python3 -m unittest discover -s tests
          node tests/test_analysis.js
          node tests/test_planner.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
